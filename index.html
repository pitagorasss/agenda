<!doctype html>
<html lang="pt-BR"> <!-- Define o idioma da página como português do Brasil. -->
  <head>
    <meta charset="UTF-8" /> <!-- Codificação de caracteres (suporta acentos). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> <!-- Ícone (favicon) exibido na aba do navegador. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Torna a página responsiva em dispositivos móveis. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" /> <!-- Acelera a conexão com o servidor de fontes do Google. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> <!-- Pré-conexão para carregar as fontes mais rápido. -->
    <!-- Importa a fonte "Inter" (400 a 700) usada na interface. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Agenda</title> <!-- Título exibido na aba do navegador. -->
  </head>
  <body>
    <div id="root"></div> <!-- Elemento onde o React montará toda a aplicação. -->
    <!-- Ponto de entrada: carrega o arquivo principal do React. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
